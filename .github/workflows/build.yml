name: build

# Publishes one tag: create/update the GitHub release, build the linux-amd64 binary,
# upload it, then prune old releases. Called by release.yml (whose tag push would not
# trigger a tag-based workflow) and dispatchable on its own to rebuild any tag.
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to (re)build, e.g. v0.1.59"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)build, e.g. v0.1.59"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
      prev_tag: ${{ steps.r.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: r
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Always the input, never GITHUB_REF_NAME: a called run has ref main, so only
          # the input resolves the same way for a called run and a manual rebuild.
          tag="$TAG_INPUT"
          if ! printf '%s\n' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag must match v<major>.<minor>.<patch>, got: $tag"
            exit 1
          fi
          # Resolve the tag exactly, and never from a checkout that happened not to
          # fetch it: release.yml creates the tag moments before calling us, so a tag
          # present on origin but missing locally is the normal case, not an error.
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git fetch --quiet --tags --force origin
          fi
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag does not exist on origin"
            exit 1
          fi
          # prev is the requested tag's predecessor in version order, so rebuilding an
          # older tag diffs against the release that came before it, not a newer one.
          prev="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | awk -v want="$tag" 'seen && !done { prev = $0; done = 1 } $0 == want { seen = 1 } END { if (done) print prev }' || true)"
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "prev_tag=$prev"
          } >> "$GITHUB_OUTPUT"
      - name: create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.r.outputs.tag }}
          PREV: ${{ steps.r.outputs.prev_tag }}
        run: |
          set -euo pipefail
          if [ -n "$PREV" ] && [ "$PREV" != "$TAG" ]; then
            CHANGELOG="$(git log --no-merges --pretty='format:- %s (%h)' --invert-grep --grep='^ci: bump VERSION' "$PREV..$TAG" | head -200)"
            [ -n "$CHANGELOG" ] || CHANGELOG="No user-visible changes since $PREV."
          else
            CHANGELOG="Initial release."
          fi
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$CHANGELOG" > "$NOTES_FILE"
          # Found -> update; "release not found" -> create; anything else is fatal so auth
          # and permission errors surface instead of looking like a missing release.
          # A new release starts as a draft: it goes live only once the build job has
          # compiled and verified an asset, so a failed build cannot leave a published
          # release with notes and nothing attached. Editing an existing release leaves its
          # published state alone, so rebuilding a shipped tag does not unpublish it.
          if gh release view "$TAG" > /dev/null 2> "$RUNNER_TEMP/view.err"; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
          elif grep -qi 'release not found' "$RUNNER_TEMP/view.err"; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file "$NOTES_FILE"
          else
            echo "::error::release lookup failed: $(cat "$RUNNER_TEMP/view.err")"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: resolve
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # linux-amd64 only: there is no consumer for another target yet, and a
        # cross-compiled leg would block the whole release chain on a transient
        # toolchain failure. Widen only for a demonstrated need.
        target: [linux-amd64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: make bootstrap
      # VERSION on the command line is what the Makefile contract expects: the target
      # reads the file with :=, which an environment variable cannot override.
      - run: make build-${{ matrix.target }} VERSION="${{ needs.resolve.outputs.version }}"
      - name: verify the binary reports the released version
        env:
          EXPECTED: ${{ needs.resolve.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # The release contract: a green build proves nothing unless the shipped program
          # states the version it was tagged with.
          actual="$(./dist/enforcer-"$TARGET" --version)"
          if [ "$actual" != "enforcer $EXPECTED" ]; then
            echo "::error::dist/enforcer-$TARGET printed '$actual', expected 'enforcer $EXPECTED'"
            exit 1
          fi
          echo "dist/enforcer-$TARGET reports $EXPECTED"
      - name: upload artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          uploaded=0
          for f in "dist"/*-"$TARGET"; do
            [ -f "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber
            uploaded=$((uploaded + 1))
          done
          if [ "$uploaded" -eq 0 ]; then
            echo "::error::no dist/*-$TARGET artifacts produced by make build-$TARGET"
            ls -la dist/ 2>/dev/null || echo "(dist/ does not exist)"
            exit 1
          fi
          echo "uploaded $uploaded asset(s) for $TARGET"
          # The release goes live only with a verified asset attached to it.
          gh release edit "$TAG" --draft=false

  prune:
    runs-on: ubuntu-latest
    needs: [resolve, build]
    if: ${{ needs.build.result == 'success' }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEEP_RELEASES: ${{ vars.KEEP_RELEASES || '5' }}
    steps:
      - name: prune old releases (keep the newest $KEEP_RELEASES; tags untouched)
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$KEEP_RELEASES" | grep -qE '^[0-9]+$' || [ "$KEEP_RELEASES" -lt 1 ]; then
            echo "::error::KEEP_RELEASES must be a positive integer, got: $KEEP_RELEASES"
            exit 1
          fi
          # Ordered by version, not by the list's creation-date order: dispatching a rebuild
          # of an old tag stamps it as newly created, which by date alone would evict the
          # release that is actually current.
          all_tags="$(gh release list --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName' | sort -rV)"
          if [ -z "$all_tags" ]; then
            echo "no releases found; nothing to prune"
            exit 0
          fi
          i=0
          deleted=0
          failed=0
          # Tag names carry no whitespace, so the word split here is the point.
          # shellcheck disable=SC2086
          for tag in $all_tags; do
            i=$((i + 1))
            if [ "$i" -le "$KEEP_RELEASES" ]; then
              continue
            fi
            if gh release delete "$tag" --yes; then
              echo "deleted release $tag"
              deleted=$((deleted + 1))
            else
              echo "::warning::delete release $tag failed"
              failed=$((failed + 1))
            fi
          done
          echo "prune summary: kept $KEEP_RELEASES, deleted $deleted, failed $failed"
