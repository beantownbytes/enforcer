name: ci
run-name: "ci :: ${{ github.event.head_commit.message || github.ref_name }}"
on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this job as its release gate instead of re-declaring the steps, because
  # the bump commit gets no workflow run of its own (a GITHUB_TOKEN push starts none) and the
  # release must run the same gate the merge did.
  workflow_call:

# A check-only job needs no write scope, and this runs fork PRs on a public repo,
# where the token scope otherwise comes from the repository default.
permissions:
  contents: read

# PR churn supersedes stale runs; a main push is the merge run and must finish, so
# cancel-in-progress is PR-only.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # bun, not a node container image: this is a bun workspace
      # (packages/enforcer + packages/pi).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: make bootstrap
      - run: make check
